[build]
  publish = "dist"
  command = "pnpm run build"

# Node and pnpm versions
[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"

# Clean URLs
[[redirects]]
  from = "/es"
  to = "/es/"
  status = 301

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML: No cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Content-Language headers for i18n SEO
[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Language = "en"

[[headers]]
  for = "/es/*"
  [headers.values]
    Content-Language = "es"

# Astro assets are hashed, so we can use aggressive caching
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static assets: 1 week (not hashed)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/files/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
